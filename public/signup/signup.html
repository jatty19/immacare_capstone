<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - ImmaCare+</title>

    <!-- USE LOCAL FILES instead of CDN -->
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <form id="signup-form" class="signup-box">
      <h3 class="text-center mb-4">Create an Account</h3>
      <h5>Personal Information</h5>

      <input
        type="text"
        id="firstName"
        name="firstname"
        placeholder="First Name"
        pattern="[A-Za-z ]+"
        title="Only letters and spaces allowed"
        maxlength="20"
        required
      />
      <input
        type="text"
        id="middleName"
        name="middlename"
        placeholder="Middle Name (optional)"
        pattern="[A-Za-z ]+"
        title="Only letters and spaces allowed"
        maxlength="20"
      />
      <input
        type="text"
        id="lastName"
        name="lastname"
        placeholder="Last Name"
        pattern="[A-Za-z ]+"
        title="Only letters and spaces allowed"
        maxlength="20"
        required
      />

      <div class="form-group">
        <select id="gender" class="gender" name="gender" required>
          <option value="" disabled selected>Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="inline-group">
        <label for="birthdate" id="bday_label">Birthdate</label>
        <input type="date" id="birthdate" name="birthdate" required/>
        <input
          type="number"
          id="age"
          name="age"
          placeholder="Age"
          min="1"
          max="120"
          readonly
        />
      </div>
      
      <h5>Account Information</h5>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Phone Number (e.g., +639123456789)"
        maxlength="13"
        minlength="13"
        oninput="this.value = this.value.replace(/[^0-9+]/g, '');"
        required
      />

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email"
        maxlength="50"
        required
      />

      <div class="input-group mb-3">
        <input
          type="password"
          name="password"
          id="password"
          class="form-control"
          placeholder="Password"
          required
        />
        <button
          class="btn btn-outline-secondary"
          type="button"
          id="togglePassword"
        >
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <div class="input-group mb-3">
        <input
          type="password"
          name="confirmPassword"
          id="confirmPassword"
          class="form-control"
          placeholder="Confirm Password"
          required
        />
        <button
          class="btn btn-outline-secondary"
          type="button"
          id="toggleConfirmPassword"
        >
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="submitBtn">Sign Up</button>
      
      <div class="text-center mt-4 noacc">
        <small>
          Already have an Account? <a href="/login">Login Here</a>
        </small>
      </div>
    </form>

    <!-- Use local jQuery or remove if not essential -->
    <script src="/jquery/jquery.min.js"></script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script>
      // Simple alert function to replace SweetAlert
      function showAlert(title, message, type = 'error') {
        alert(`${title}: ${message}`);
      }

      document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('signup-form');
        const submitBtn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          console.log('Form submission started...');
          
          // Disable button to prevent double submission
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating Account...';
          
          // Get form data
          const formData = new FormData(form);
          const data = {
            firstname: formData.get('firstname'),
            middlename: formData.get('middlename'),
            lastname: formData.get('lastname'),
            gender: formData.get('gender'),
            birthdate: formData.get('birthdate'),
            age: formData.get('age'),
            phone: formData.get('phone'),
            email: formData.get('email'),
            password: formData.get('password')
          };
          
          console.log('Sending data:', data);
          
          // Validate passwords match
          const password = formData.get('password');
          const confirmPassword = formData.get('confirmPassword');
          
          if (password !== confirmPassword) {
            alert('Error: Passwords do not match!');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up';
            return;
          }
          
          try {
            const API_BASE = window.location.origin;
            console.log('Sending to:', `${API_BASE}/register`);
            
            const response = await fetch('/register', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(data)
            });
            
            console.log('Response status:', response.status);
            
            const result = await response.json();
            console.log('Server response:', result);
            
            if (response.ok) {
              alert('Success: ' + result.message);
              window.location.href = '/login';
            } else {
              alert('Error: ' + (result.message || 'Registration failed'));
            }
          } catch (error) {
            console.error('Registration error:', error);
            alert('Connection Error: Cannot connect to server. Please check your internet connection and try again.');
          } finally {
            // Re-enable button
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up';
          }
        });
        
        // Password toggle functionality
        document.getElementById('togglePassword').addEventListener('click', function() {
          const passwordInput = document.getElementById('password');
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          this.querySelector('i').classList.toggle('bi-eye');
          this.querySelector('i').classList.toggle('bi-eye-slash');
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
          const confirmInput = document.getElementById('confirmPassword');
          const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
          confirmInput.setAttribute('type', type);
          this.querySelector('i').classList.toggle('bi-eye');
          this.querySelector('i').classList.toggle('bi-eye-slash');
        });
        
        // Age calculation from birthdate
        document.getElementById('birthdate').addEventListener('change', function() {
          const birthdate = new Date(this.value);
          const today = new Date();
          let age = today.getFullYear() - birthdate.getFullYear();
          const monthDiff = today.getMonth() - birthdate.getMonth();
          
          if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthdate.getDate())) {
            age--;
          }
          
          document.getElementById('age').value = age;
        });
      });
    </script>
  </body>
</html>
